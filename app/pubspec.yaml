name: aura
description: "Aura — DPI-resistant VPN with aura. sing-box TUN + NaiveProxy."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  archive: ^4.0.2
  crypto: ^3.0.6
  http: ^1.2.0
  path_provider: ^2.1.4
  window_manager: ^0.5.2
  tray_manager: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/singbox.template.json
    - assets/tray/
