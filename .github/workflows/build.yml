name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  NAIVE_VERSION: 150.0.7871.63-1
  FLUTTER_VERSION: 3.44.9

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: aura-core/go.mod

      - name: Test aura-core
        working-directory: aura-core
        run: go test ./...

      - name: Validate PowerShell deployment scripts
        shell: pwsh
        run: |
          $failed = $false
          @(Get-ChildItem infra -Filter *.ps1) + @(Get-ChildItem app/tool -Filter *.ps1) | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare secrets.dart from example
        shell: pwsh
        run: Copy-Item app/lib/secrets.example.dart app/lib/secrets.dart -Force

      - name: Download NaiveProxy and Wintun (windows-amd64)
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\naiveproxy"
          $dir = "$work\bundle"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = "$work\naive.zip"
          Invoke-WebRequest "https://github.com/klzgrad/naiveproxy/releases/download/v$env:NAIVE_VERSION/naiveproxy-v$env:NAIVE_VERSION-win-x64.zip" -OutFile $zip
          $extract = "$work\ex"
          Expand-Archive $zip $extract
          Get-ChildItem "$extract" -Directory | Select-Object -First 1 | ForEach-Object {
            Copy-Item "$($_.FullName)\naive.exe" "$dir\naive.exe" -Force
          }
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "$work\wintun.zip"
          Expand-Archive "$work\wintun.zip" "$work\w"
          Copy-Item "$work\w\wintun\bin\amd64\wintun.dll" "$dir\wintun.dll" -Force
          echo "NAIVE_DIR=$dir" >> $env:GITHUB_ENV

      - name: Test official NaiveProxy integration
        shell: pwsh
        working-directory: aura-core
        run: |
          $env:AURA_NAIVE_PATH = "$env:NAIVE_DIR\naive.exe"
          go test -run TestNaiveProxyMultiListenerIntegration -count=1 .

      - run: flutter pub get
        working-directory: app

      - run: flutter analyze
        working-directory: app

      - run: flutter test --concurrency=1 --reporter=expanded
        working-directory: app

      - run: flutter build windows --release
        working-directory: app

      - name: Build aura-core helper
        shell: pwsh
        working-directory: aura-core
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o aura-core.exe .

      - name: Bundle Aura Core + NaiveProxy + Wintun + zip
        shell: pwsh
        run: |
          $rel = "app\build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force -Path "$rel\aura-core" | Out-Null
          Copy-Item "aura-core\aura-core.exe" "$rel\aura-core\aura-core.exe" -Force
          Copy-Item "$env:NAIVE_DIR\naive.exe" "$rel\aura-core\naive.exe" -Force
          Copy-Item "$env:NAIVE_DIR\wintun.dll" "$rel\aura-core\wintun.dll" -Force
          if (Get-ChildItem "$rel\aura-core" -Recurse | Where-Object Name -Match 'sing-box|singbox') { throw 'sing-box leaked into the 0.3.0 bundle' }
          Compress-Archive -Path "$rel\*" -DestinationPath aura-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: aura-windows-amd64
          path: aura-windows-amd64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: aura-core/go.mod

      - name: Test aura-core
        working-directory: aura-core
        run: go test ./...

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare secrets.dart from example
        run: cp app/lib/secrets.example.dart app/lib/secrets.dart

      - name: Download NaiveProxy (darwin-arm64)
        run: |
          NAIVE_DIR="$RUNNER_TEMP/naiveproxy"; mkdir -p "$NAIVE_DIR"
          curl -fsSL "https://github.com/klzgrad/naiveproxy/releases/download/v${NAIVE_VERSION}/naiveproxy-v${NAIVE_VERSION}-mac-arm64-arm64.tar.xz" | tar -xJ -C "$NAIVE_DIR" --strip-components=1
          echo "NAIVE_DIR=$NAIVE_DIR" >> "$GITHUB_ENV"

      - name: Test official NaiveProxy integration
        working-directory: aura-core
        run: AURA_NAIVE_PATH="$NAIVE_DIR/naive" go test -run TestNaiveProxyMultiListenerIntegration -count=1 .

      - run: flutter pub get
        working-directory: app

      - run: flutter analyze
        working-directory: app

      - run: flutter test --concurrency=1 --reporter=expanded
        working-directory: app

      - run: flutter build macos --release
        working-directory: app

      - name: Build aura-core helper
        working-directory: aura-core
        run: go build -trimpath -ldflags "-s -w" -o aura-core .

      - name: Bundle Aura Core + NaiveProxy + zip
        run: |
          APP="app/build/macos/Build/Products/Release/aura.app"
          mkdir -p "$APP/Contents/MacOS/aura-core"
          cp aura-core/aura-core "$APP/Contents/MacOS/aura-core/"
          cp "$NAIVE_DIR"/naive "$APP/Contents/MacOS/aura-core/"
          ! find "$APP" -iname '*sing-box*' -o -iname '*singbox*' | grep -q .
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" aura-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: aura-macos-arm64
          path: aura-macos-arm64.zip

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Validate release changelog
        run: node worker/scripts/validate-release-changelog.mjs "releases/${GITHUB_REF_NAME}.md" "${GITHUB_REF_NAME}"

      - name: Build source archive
        run: git archive --format=zip --prefix="aura-${GITHUB_REF_NAME}/" --output aura-source.zip HEAD

      - name: Publish version archive to Aura
        env:
          AURA_RELEASE_UPLOAD_TOKEN: ${{ secrets.AURA_RELEASE_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          publish() {
            curl --fail-with-body --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${AURA_RELEASE_UPLOAD_TOKEN}" \
              -F "version=${GITHUB_REF_NAME}" \
              -F "artifact=$1" \
              -F "file=@$2;type=application/zip" \
              https://api.copal.run/v1/releases/publish
          }
          publish windows dist/aura-windows-amd64/aura-windows-amd64.zip
          publish macos dist/aura-macos-arm64/aura-macos-arm64.zip
          publish source aura-source.zip

      - name: Announce release in Discord
        env:
          AURA_RELEASE_UPLOAD_TOKEN: ${{ secrets.AURA_RELEASE_UPLOAD_TOKEN }}
        run: |
          jq -n \
            --arg version "${GITHUB_REF_NAME}" \
            --rawfile changelog "releases/${GITHUB_REF_NAME}.md" \
            '{version: $version, changelog: $changelog}' > release-announcement.json
          curl --fail-with-body --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${AURA_RELEASE_UPLOAD_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @release-announcement.json \
            https://api.copal.run/v1/releases/announce

      - uses: softprops/action-gh-release@v2
        with:
          body_path: releases/${{ github.ref_name }}.md
          files: |
            dist/**/*.zip
            aura-source.zip
