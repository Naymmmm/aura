name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  SB_VERSION: 1.13.15
  FLUTTER_VERSION: 3.44.9

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: aura-core/go.mod

      - name: Test aura-core
        working-directory: aura-core
        run: go test ./...

      - name: Validate PowerShell deployment scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem infra -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare secrets.dart from example
        shell: pwsh
        run: Copy-Item app/lib/secrets.example.dart app/lib/secrets.dart -Force

      - name: Download sing-box (windows-amd64)
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\singbox"
          $dir = "$work\engine"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = "$work\sb.zip"
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$env:SB_VERSION/sing-box-$env:SB_VERSION-windows-amd64.zip" -OutFile $zip
          $extract = "$work\ex"
          Expand-Archive $zip $extract
          Get-ChildItem "$extract" -Directory | Select-Object -First 1 | ForEach-Object {
            Get-ChildItem $_.FullName | Copy-Item -Destination $dir -Recurse -Force
          }
          if (-not (Test-Path "$dir\wintun.dll")) {
            Invoke-WebRequest "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "$work\wintun.zip"
            Expand-Archive "$work\wintun.zip" "$work\w"
            Copy-Item "$work\w\wintun\bin\amd64\wintun.dll" "$dir"
          }
          echo "SB_DIR=$dir" >> $env:GITHUB_ENV

      - name: Validate client tunnel config
        shell: pwsh
        run: '& "$env:SB_DIR\sing-box.exe" check -c app/assets/singbox.template.json'

      - run: flutter pub get
        working-directory: app

      - run: flutter build windows --release
        working-directory: app

      - name: Build aura-core helper
        shell: pwsh
        working-directory: aura-core
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o aura-core.exe .

      - name: Bundle aura-core + Naive engine + zip
        shell: pwsh
        run: |
          $rel = "app\build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force -Path "$rel\aura-core\engine" | Out-Null
          Copy-Item "aura-core\aura-core.exe" "$rel\aura-core\aura-core.exe" -Force
          Get-ChildItem "$env:SB_DIR" | Copy-Item -Destination "$rel\aura-core\engine" -Force
          Compress-Archive -Path "$rel\*" -DestinationPath aura-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: aura-windows-amd64
          path: aura-windows-amd64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: aura-core/go.mod

      - name: Test aura-core
        working-directory: aura-core
        run: go test ./...

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare secrets.dart from example
        run: cp app/lib/secrets.example.dart app/lib/secrets.dart

      - name: Download sing-box (darwin-arm64)
        run: |
          SB_DIR="$RUNNER_TEMP/singbox"; mkdir -p "$SB_DIR"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-darwin-arm64.tar.gz" | tar -xz -C "$SB_DIR" --strip-components=1
          echo "SB_DIR=$SB_DIR" >> "$GITHUB_ENV"

      - run: flutter pub get
        working-directory: app

      - run: flutter build macos --release
        working-directory: app

      - name: Build aura-core helper
        working-directory: aura-core
        run: go build -trimpath -ldflags "-s -w" -o aura-core .

      - name: Bundle aura-core + Naive engine + zip
        run: |
          APP="app/build/macos/Build/Products/Release/aura.app"
          mkdir -p "$APP/Contents/MacOS/aura-core/engine"
          cp aura-core/aura-core "$APP/Contents/MacOS/aura-core/"
          cp "$SB_DIR"/sing-box "$APP/Contents/MacOS/aura-core/engine/"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" aura-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: aura-macos-arm64
          path: aura-macos-arm64.zip

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish auto-update artifacts
        env:
          AURA_RELEASE_UPLOAD_TOKEN: ${{ secrets.AURA_RELEASE_UPLOAD_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $AURA_RELEASE_UPLOAD_TOKEN" \
            -F "key=latest" \
            -F "version=$RELEASE_VERSION" \
            -F "file=@dist/aura-windows-amd64/aura-windows-amd64.zip;type=application/zip" \
            https://api.copal.run/v1/release/upload
          curl --fail-with-body --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $AURA_RELEASE_UPLOAD_TOKEN" \
            -F "key=latest-macos" \
            -F "version=$RELEASE_VERSION" \
            -F "file=@dist/aura-macos-arm64/aura-macos-arm64.zip;type=application/zip" \
            https://api.copal.run/v1/release/upload

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
