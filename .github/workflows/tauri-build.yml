name: tauri build

on:
  push:
    branches: ['tauri']
  workflow_dispatch:

env:
  NAIVE_VERSION: 150.0.7871.63-1

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-tauri/src-tauri

      - name: Install frontend deps
        working-directory: app-tauri
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: aura-core/go.mod

      - name: Bundle aura-core + naive + wintun (windows)
        shell: pwsh
        run: |
          $dir = "app-tauri\src-tauri\resources\aura-core"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Push-Location aura-core
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o "..\$dir\aura-core.exe" .
          Pop-Location
          $zip = "$env:RUNNER_TEMP\naive.zip"
          Invoke-WebRequest "https://github.com/klzgrad/naiveproxy/releases/download/v$env:NAIVE_VERSION/naiveproxy-v$env:NAIVE_VERSION-win-x64.zip" -OutFile $zip
          $ex = "$env:RUNNER_TEMP\ex"
          Expand-Archive $zip $ex
          Get-ChildItem "$ex" -Directory | Select-Object -First 1 | ForEach-Object { Copy-Item "$($_.FullName)\naive.exe" "$dir\naive.exe" -Force }
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "$env:RUNNER_TEMP\wintun.zip"
          Expand-Archive "$env:RUNNER_TEMP\wintun.zip" "$env:RUNNER_TEMP\w"
          Copy-Item "$env:RUNNER_TEMP\w\wintun\bin\amd64\wintun.dll" "$dir\wintun.dll" -Force

      - name: Build Tauri app (portable, no installer)
        working-directory: app-tauri
        run: npx tauri build --no-bundle

      - name: Zip the portable Windows app
        shell: pwsh
        run: |
          $rel = "app-tauri\src-tauri\target\release"
          $stage = "staging"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$rel\aura.exe" "$stage\aura.exe" -Force
          if (Test-Path "$rel\resources") { Copy-Item "$rel\resources" "$stage\resources" -Recurse -Force }
          Compress-Archive -Path "$stage\*" -DestinationPath aura-tauri-windows-amd64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-amd64
          path: aura-tauri-windows-amd64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-tauri/src-tauri

      - name: Install frontend deps
        working-directory: app-tauri
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: aura-core/go.mod

      - name: Bundle aura-core + naive (macos)
        run: |
          dir="app-tauri/src-tauri/resources/aura-core"
          mkdir -p "$dir"
          (cd aura-core && go build -trimpath -ldflags "-s -w" -o "../$dir/aura-core" .)
          NAIVE_DIR="$RUNNER_TEMP/naiveproxy"; mkdir -p "$NAIVE_DIR"
          curl -fsSL "https://github.com/klzgrad/naiveproxy/releases/download/v${NAIVE_VERSION}/naiveproxy-v${NAIVE_VERSION}-mac-arm64-arm64.tar.xz" | tar -xJ -C "$NAIVE_DIR" --strip-components=1
          cp "$NAIVE_DIR/naive" "$dir/naive"

      - name: Build Tauri app (DMG)
        working-directory: app-tauri
        run: npx tauri build --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-arm64
          path: app-tauri/src-tauri/target/release/bundle/dmg/*.dmg

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish tauri-dev build to the archive
        env:
          AURA_RELEASE_UPLOAD_TOKEN: ${{ secrets.AURA_RELEASE_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail

          # Label the Tauri port separately from the Flutter dev builds.
          base="$(node -p "require('./app-tauri/package.json').version")"
          version="v${base}-tauri-dev.${GITHUB_RUN_NUMBER}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

          git archive --format=zip --prefix="aura-${version}/" --output aura-source.zip HEAD

          publish() {
            local artifact="$1"
            local file="$2"
            local sha256 content_type
            sha256="$(sha256sum "$file" | awk '{print $1}')"
            content_type=application/zip
            case "$file" in *.dmg) content_type=application/x-apple-diskimage ;; esac
            curl --fail-with-body --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${AURA_RELEASE_UPLOAD_TOKEN}" \
              -F "version=${version}" \
              -F "artifact=${artifact}" \
              -F "sha256=${sha256}" \
              -F "promote=false" \
              -F "file=@${file};type=${content_type}" \
              https://api.copal.run/v1/releases/publish
          }

          publish windows "$(ls dist/tauri-windows-amd64/*.zip | head -1)"
          publish macos "$(ls dist/tauri-macos-arm64/*.dmg | head -1)"
          publish source aura-source.zip
