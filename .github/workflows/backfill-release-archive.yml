name: Backfill Aura release archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload historical releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AURA_RELEASE_UPLOAD_TOKEN: ${{ secrets.AURA_RELEASE_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail

          upload_release() {
            local version="$1"
            local promote="$2"
            local release_dir
            release_dir="$(mktemp -d)"

            gh release download "$version" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$release_dir" \
              --pattern 'aura-windows-amd64.zip' \
              --pattern 'aura-macos-arm64.zip'
            git archive --format=zip --output="$release_dir/aura-source.zip" "$version"

            upload_artifact() {
              local artifact="$1"
              local file="$2"
              local sha256
              sha256="$(sha256sum "$file" | awk '{print $1}')"
              curl --fail-with-body --retry 5 --retry-all-errors \
                -H "Authorization: Bearer ${AURA_RELEASE_UPLOAD_TOKEN}" \
                -F "version=${version}" -F "artifact=${artifact}" \
                -F "sha256=${sha256}" -F "promote=${promote}" \
                -F "file=@${file};type=application/zip" \
                https://api.copal.run/v1/releases/publish
            }

            upload_artifact windows "$release_dir/aura-windows-amd64.zip"
            upload_artifact macos "$release_dir/aura-macos-arm64.zip"
            upload_artifact source "$release_dir/aura-source.zip"

            rm -rf -- "$release_dir"
          }

          for version in \
            v0.1.0 v0.2.0 v0.2.1 v0.2.2 v0.2.3 \
            v0.2.4 v0.2.5 v0.2.6 v0.3.0
          do
            upload_release "$version" false
          done

          echo 'Upload v0.3.1 last to restore all canonical latest pointers'
          upload_release v0.3.1 true
