name: publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag to publish, for example v26.0.1
        required: true
        type: string
      source_run_id:
        description: Completed build run that produced the Windows, macOS and Linux artifacts
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: aura-*
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the Linux download under the 95 MB upload cap
        run: |
          set -euo pipefail
          # The archive takes the AppImage; the .deb ships on the GitHub release.
          d=dist/aura-linux-x64
          if unzip -l "$d/aura-linux-x64.zip" | grep -q '\.deb$'; then
            (cd "$d" && unzip -q -o aura-linux-x64.zip '*.deb' && zip -q -d aura-linux-x64.zip '*.deb')
          fi
          ls -l "$d"

      - name: Validate release changelog
        run: node worker/scripts/validate-release-changelog.mjs "releases/${{ inputs.version }}.md" "${{ inputs.version }}"

      - name: Build source archive
        run: git archive --format=zip --prefix="aura-${{ inputs.version }}/" --output aura-source.zip HEAD

      - name: Publish version archive to Aura
        env:
          AURA_RELEASE_UPLOAD_TOKEN: ${{ secrets.AURA_RELEASE_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          # publish <artifact> <file>: a <file>.sig next to it is the updater
          # signature and goes along with it.
          publish() {
            local -a signature=()
            sha256="$(sha256sum "$2" | awk '{print $1}')"
            content_type=application/zip
            case "$2" in
              *.dmg) content_type=application/x-apple-diskimage ;;
              *.exe) content_type=application/vnd.microsoft.portable-executable ;;
              *.tar.gz) content_type=application/gzip ;;
              *.AppImage) content_type=application/octet-stream ;;
            esac
            if [ -f "$2.sig" ]; then signature=(-F "signature=$(cat "$2.sig")"); fi
            curl --fail-with-body --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${AURA_RELEASE_UPLOAD_TOKEN}" \
              -F "version=${{ inputs.version }}" \
              -F "artifact=$1" \
              -F "sha256=${sha256}" \
              "${signature[@]}" \
              -F "file=@$2;type=${content_type}" \
              https://api.copal.run/v1/releases/publish
          }
          publish windows dist/aura-windows-amd64/aura-windows-amd64.zip
          publish windows-arm64 dist/aura-windows-arm64/aura-windows-arm64.zip
          # Builds from before the installer existed only have zips.
          for arch in amd64 arm64; do
            setup="dist/aura-windows-$arch/aura-windows-$arch-setup.exe"
            artifact=windows-setup; [ "$arch" = arm64 ] && artifact=windows-arm64-setup
            if [ -f "$setup" ]; then publish "$artifact" "$setup"; fi
          done
          publish macos dist/aura-macos-universal/aura-macos-universal.dmg
          publish linux dist/aura-linux-x64/aura-linux-x64.zip
          # Signed in-app update payloads, from builds that made them.
          update=dist/aura-macos-universal/aura-macos-universal.app.tar.gz
          if [ -f "$update.sig" ]; then publish macos-update "$update"; fi
          update=dist/aura-linux-x64/aura-linux-x64.AppImage
          if [ -f "$update.sig" ]; then publish linux-update "$update"; fi
          publish source aura-source.zip

      - name: Announce release in Discord
        env:
          AURA_RELEASE_UPLOAD_TOKEN: ${{ secrets.AURA_RELEASE_UPLOAD_TOKEN }}
        run: |
          jq -n \
            --arg version "${{ inputs.version }}" \
            --rawfile changelog "releases/${{ inputs.version }}.md" \
            '{version: $version, changelog: $changelog}' > release-announcement.json
          curl --fail-with-body --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${AURA_RELEASE_UPLOAD_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @release-announcement.json \
            https://api.copal.run/v1/releases/announce

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          body_path: releases/${{ inputs.version }}.md
          files: |
            dist/**/*.zip
            dist/**/*.dmg
            dist/**/*.deb
            dist/**/*.exe
            aura-source.zip
